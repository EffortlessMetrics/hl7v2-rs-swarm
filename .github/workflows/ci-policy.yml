name: CI Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  ci-lane-whitelist:
    name: CI Lane Whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-xtask-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check CI lane whitelist
        run: cargo run -p xtask -- check-ci-lane-whitelist

      - name: Fetch source repository main
        if: github.event_name != 'pull_request'
        run: |
          git remote remove source 2>/dev/null || true
          git remote add source https://github.com/EffortlessMetrics/hl7v2-rs.git
          git fetch --no-tags --depth=1 source main

      - name: Check source/swarm sync boundary
        if: github.event_name != 'pull_request'
        run: cargo run -p xtask -- check-source-sync-boundary --source-ref source/main --swarm-ref HEAD
