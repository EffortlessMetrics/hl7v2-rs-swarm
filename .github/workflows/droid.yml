# Factory Droid automatic pull request review.
#
# Required setup before use:
# - Install the Factory Droid GitHub App for this repository.
# - Add FACTORY_API_KEY as a repository or organization Actions secret.
# - Add MINIMAX_API_KEY as a repository or organization Actions secret using a
#   MiniMax Token Plan Subscription Key (typically sk-cp-...).
#
# This workflow configures Factory BYOK with MiniMax M3 through MiniMax's
# Anthropic-compatible endpoint, then pins both code review and security review
# to the deterministic Droid custom model ID custom:MiniMax-M3-0.
name: Droid PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: droid-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  droid-review:
    name: Review PR with MiniMax M3
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Verify Droid secrets
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::FACTORY_API_KEY secret is not configured. Add it under repository or organization Actions secrets before enabling Droid PR review."
            exit 1
          fi

          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::error::MINIMAX_API_KEY secret is not configured. Add the MiniMax Token Plan Subscription Key under repository or organization Actions secrets before enabling Droid PR review."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure MiniMax M3 for Droid BYOK
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"

          cat > "$HOME/.factory/settings.json" <<'JSON'
          {
            "customModels": [
              {
                "model": "MiniMax-M3",
                "displayName": "MiniMax-M3",
                "baseUrl": "https://api.minimax.io/anthropic",
                "apiKey": "${MINIMAX_API_KEY}",
                "provider": "anthropic",
                "maxOutputTokens": 64000
              }
            ]
          }
          JSON

      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ""
          ANTHROPIC_BASE_URL: ""
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          review_model: custom:MiniMax-M3-0
          automatic_security_review: true
          security_model: custom:MiniMax-M3-0
