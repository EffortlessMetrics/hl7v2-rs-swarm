name: HL7v2 Rust Small

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: em-ci-routed-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: PR Plan
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-plan.yml

  route-rust-small:
    name: Route Rust Small
    needs: plan
    if: >-
      always() && (
        needs.plan.result == 'skipped' ||
        needs.plan.outputs.docs_only != 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      router_target: ${{ steps.route.outputs.router_target }}
      router_reason: ${{ steps.route.outputs.router_reason }}
      repo: ${{ steps.route.outputs.repo }}
      workflow: ${{ steps.route.outputs.workflow }}
      run_id: ${{ steps.route.outputs.run_id }}
    steps:
      - name: Choose runner route
        id: route
        env:
          EM_RUNNER_READ_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: em-ci-routed-rust
        run: |
          set -euo pipefail

          choose() {
            local target="$1"
            local reason="$2"
            {
              echo "router_target=$target"
              echo "router_reason=$reason"
              echo "repo=$REPOSITORY"
              echo "workflow=$WORKFLOW_NAME"
              echo "run_id=$GITHUB_RUN_ID"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### HL7v2 Rust Small Route"
              echo ""
              echo "- repo: \`$REPOSITORY\`"
              echo "- workflow: \`$WORKFLOW_NAME\`"
              echo "- run_id: \`$GITHUB_RUN_ID\`"
              echo "- router_target: \`$target\`"
              echo "- router_reason: \`$reason\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$IS_FORK_PR" = "true" ]; then
            choose "github" "fork_pr"
            exit 0
          fi

          if [ -z "${EM_RUNNER_READ_TOKEN:-}" ]; then
            choose "github" "runner_token_missing"
            exit 0
          fi

          response="$(mktemp)"
          status="$(curl -sS -w '%{http_code}' -o "$response" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $EM_RUNNER_READ_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runners?per_page=100" || true)"

          if [ "$status" != "200" ]; then
            echo "::notice::runner API returned HTTP $status; using GitHub-hosted fallback"
            choose "github" "runner_api_failed"
            exit 0
          fi

          cx53="$(jq -r '[.runners[]
            | select(.status == "online" and (.busy | not))
            | select([.labels[].name] as $labels
              | (["em-ci", "cx53", "rust-small", "trusted-pr"] - $labels | length == 0))
            | .name] | first // ""' "$response")"

          if [ -n "$cx53" ]; then
            echo "Selected CX53 runner: $cx53"
            choose "cx53" "cx53_idle"
            exit 0
          fi

          cx43="$(jq -r '[.runners[]
            | select(.status == "online" and (.busy | not))
            | select([.labels[].name] as $labels
              | (["em-ci", "cx43", "rust-small", "trusted-pr"] - $labels | length == 0))
            | .name] | first // ""' "$response")"

          if [ -n "$cx43" ]; then
            echo "Selected CX43 runner: $cx43"
            choose "cx43" "cx43_idle"
            exit 0
          fi

          choose "github" "no_idle_runner"

  rust-small-cx53:
    name: Rust Small on CX53
    needs: route-rust-small
    if: >-
      always() &&
      needs.route-rust-small.result == 'success' &&
      needs.route-rust-small.outputs.router_target == 'cx53'
    runs-on: [self-hosted, Linux, X64, em-ci, cx53, rust-small, trusted-pr]
    timeout-minutes: 25
    container:
      image: em-ci-rust:1.95
      options: --cpus=14 --memory=28g
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/hl7v2-rs-swarm/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Preflight disk and toolchain
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 100
          ci-disk-guard /mnt/docker 20
          ci-disk-guard /mnt/ci-cache 20
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true
          rustc --version
          cargo --version
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

      - name: Run Rust small gate
        run: cargo run -p xtask -- gate --check

      - name: Cleanup and final stats
        if: always()
        run: |
          set +e
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
          rm -rf "$CARGO_TARGET_DIR"
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true

  rust-small-cx43:
    name: Rust Small on CX43
    needs: route-rust-small
    if: >-
      always() &&
      needs.route-rust-small.result == 'success' &&
      needs.route-rust-small.outputs.router_target == 'cx43'
    runs-on: [self-hosted, Linux, X64, em-ci, cx43, rust-small, trusted-pr]
    timeout-minutes: 30
    container:
      image: em-ci-rust:1.95
      options: --cpus=8 --memory=16g
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/hl7v2-rs-swarm/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Preflight disk and toolchain
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 100
          ci-disk-guard /mnt/docker 20
          ci-disk-guard /mnt/ci-cache 20
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true
          rustc --version
          cargo --version
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

      - name: Run Rust small gate
        run: cargo run -p xtask -- gate --check

      - name: Cleanup and final stats
        if: always()
        run: |
          set +e
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
          rm -rf "$CARGO_TARGET_DIR"
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true

  rust-small-github:
    name: Rust Small on GitHub Hosted
    needs: route-rust-small
    if: >-
      always() &&
      needs.route-rust-small.result == 'success' &&
      needs.route-rust-small.outputs.router_target == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-rust-small-1.95-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust small gate
        run: cargo run -p xtask -- gate --check

  docs-gate:
    name: Docs Gate
    needs: plan
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify docs-only path
        run: |
          set -euo pipefail
          echo "Docs-only PR: skipping Rust small gate"
          if [ -d docs ]; then
            find docs -name '*.md' -print | wc -l
          else
            echo "docs/ directory not present"
          fi

  hl7v2-rust-small-result:
    name: HL7v2 Rust Small Result
    needs:
      - plan
      - route-rust-small
      - rust-small-cx53
      - rust-small-cx43
      - rust-small-github
      - docs-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate routed result
        env:
          PLAN: ${{ needs.plan.result }}
          ROUTE: ${{ needs.route-rust-small.result }}
          CX53: ${{ needs.rust-small-cx53.result }}
          CX43: ${{ needs.rust-small-cx43.result }}
          GITHUB_HOSTED: ${{ needs.rust-small-github.result }}
          DOCS: ${{ needs.docs-gate.result }}
          ROUTER_TARGET: ${{ needs.route-rust-small.outputs.router_target }}
          ROUTER_REASON: ${{ needs.route-rust-small.outputs.router_reason }}
          ROUTER_REPO: ${{ needs.route-rust-small.outputs.repo }}
          ROUTER_WORKFLOW: ${{ needs.route-rust-small.outputs.workflow }}
          ROUTER_RUN_ID: ${{ needs.route-rust-small.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "plan=$PLAN route=$ROUTE cx53=$CX53 cx43=$CX43 github=$GITHUB_HOSTED docs=$DOCS"
          echo "router_target=${ROUTER_TARGET:-} router_reason=${ROUTER_REASON:-}"

          {
            echo "### HL7v2 Rust Small Result"
            echo ""
            echo "- plan: \`$PLAN\`"
            echo "- route: \`$ROUTE\`"
            echo "- cx53: \`$CX53\`"
            echo "- cx43: \`$CX43\`"
            echo "- github_hosted: \`$GITHUB_HOSTED\`"
            echo "- docs: \`$DOCS\`"
            echo "- router_target: \`${ROUTER_TARGET:-}\`"
            echo "- router_reason: \`${ROUTER_REASON:-}\`"
            echo "- repo: \`${ROUTER_REPO:-}\`"
            echo "- workflow: \`${ROUTER_WORKFLOW:-}\`"
            echo "- run_id: \`${ROUTER_RUN_ID:-}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PLAN" = "failure" ] || [ "$PLAN" = "cancelled" ]; then
            echo "::error::PR Plan failed or was cancelled"
            exit 1
          fi

          if [ "$DOCS" = "success" ] && [ "$ROUTE" = "skipped" ]; then
            echo "Docs-only gate passed"
            exit 0
          fi

          if [ "$ROUTE" != "success" ]; then
            echo "::error::Router did not complete successfully: $ROUTE"
            exit 1
          fi

          case "${ROUTER_TARGET:-}" in
            cx53)
              if [ "$CX53" = "success" ] && [ "$CX43" = "skipped" ] && [ "$GITHUB_HOSTED" = "skipped" ]; then
                echo "CX53 route passed"
                exit 0
              fi
              ;;
            cx43)
              if [ "$CX43" = "success" ] && [ "$CX53" = "skipped" ] && [ "$GITHUB_HOSTED" = "skipped" ]; then
                echo "CX43 route passed"
                exit 0
              fi
              ;;
            github)
              if [ "$GITHUB_HOSTED" = "success" ] && [ "$CX53" = "skipped" ] && [ "$CX43" = "skipped" ]; then
                echo "GitHub-hosted route passed"
                exit 0
              fi
              ;;
          esac

          echo "::error::Routed result did not pass cleanly"
          exit 1
